# Configuración de la aplicación (se lee en UTF-8).
# Los valores de una lista se separan con punto y coma (;).

# ---------- Catálogos ----------
competencias=Lectura crítica;Razonamiento cuantitativo;Competencias ciudadanas;Comunicación escrita;Inglés;Formulación de proyectos de ingeniería;Pensamiento científico: matemáticas y estadística;Diseño de software
dificultades=Baja;Media;Alta

# ---------- Validación estructural ----------
contexto.longitud.minima=10
opcion.longitud.maxima=400
expresiones.prohibidas=todas las anteriores;ninguna de las anteriores;todas las opciones anteriores;ninguna de las opciones anteriores;todas son correctas;ninguna es correcta

# ---------- Listado ----------
pagina.tamano=5

# ---------- Datos de demostración ----------
